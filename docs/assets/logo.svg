<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="52%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="112" y1="310" x2="210" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="planeTop" x1="160" y1="120" x2="405" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="planeShadow" x1="210" y1="260" x2="365" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#glow)"/>
  <rect x="22" y="22" width="468" height="468" rx="110" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="4"/>

  <!-- Audio waveform bars (bottom-left voice/stream motif) -->
  <rect x="92" y="352" width="22" height="52" rx="11" fill="url(#wave)" fill-opacity="0.82"/>
  <rect x="128" y="324" width="22" height="96" rx="11" fill="url(#wave)"/>
  <rect x="164" y="346" width="22" height="66" rx="11" fill="url(#wave)" fill-opacity="0.9"/>
  <rect x="200" y="368" width="22" height="36" rx="11" fill="url(#wave)" fill-opacity="0.72"/>

  <!-- Sleek Telegram-inspired paper plane (voice/video call carrier) -->
  <path d="M120 226.5L388 122C399.5 117.5 410.5 128 406.5 139.8L343.5 344.5C339.8 356.5 324.6 360.8 315.2 352.6L255.5 300.5L218 334.5C212.5 339.5 203.5 336.2 202.5 328.8L196 277.5L122 248.5C110.2 243.8 109.5 230.6 120 226.5Z" fill="url(#planeTop)"/>

  <!-- Inner fold for crisp 3D depth -->
  <path d="M196 277.5L362 162L242 289.5L255.5 300.5L218 334.5C212.5 339.5 203.5 336.2 202.5 328.8L196 277.5Z" fill="url(#planeShadow)"/>
  <path d="M242 289.5L362 162L255.5 300.5L242 289.5Z" fill="#38BDF8" fill-opacity="0.45"/>

  <!-- Signal arcs (top-left subtle broadcast waves) -->
  <path d="M118 164C126 138 148 118 175 112" stroke="#7DD3FC" stroke-width="12" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M92 156C104 118 134 90 172 82" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>
