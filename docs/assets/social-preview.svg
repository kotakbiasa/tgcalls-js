    <rect x="760" y="400" width="176" height="44" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="848" y="428" text-anchor="middle">Folder Recording</text>

    <rect x="952" y="400" width="188" height="44" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="1046" y="428" text-anchor="middle">RTMP &amp; E2E Conf</text>
