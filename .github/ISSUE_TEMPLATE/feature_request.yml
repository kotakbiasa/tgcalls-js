name: Feature Request
description: Suggest a new feature or improvement for tgcalls-js
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What are you trying to build, and what limitation did you hit?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / Solution
      description: How would you like this to work? Include an example snippet if helpful.
      render: ts
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative designs you considered.
