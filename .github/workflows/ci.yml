name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The video test builds an ffmpeg fixture; without it that part is
      # skipped, so install ffmpeg for full coverage.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck:all
      - run: npm test
      - run: npm run smoke
